# botforge example configuration
#
# Every value here is optional. A device can boot with nothing but the
# extensions line below and be configured entirely by talking to it - the
# provider, the API key, the bot's personality and all of its tools are
# stored in the database, not here.
#
# None of the words the device says live in the Python source either. They
# come from a locale file; see `language` below.

# --- zoozl, the transport and routing layer ------------------------------

# Point zoozl at the plugin module, not the package.
extensions = ["botforge.plugin"]

# zoozl's own store, for its conversation routing. Separate from botforge's
# database below, and optional - without it zoozl keeps that state in memory.
# memory_path = "sqlite://zoozl_routing.db"

# --- botforge ------------------------------------------------------------

[botforge]

# Where botforge keeps everything it owns: the provider, agents, tools and
# conversation history, all in one SQLite file.
database = "botforge.db"

# Which zoozl aliases route to this bot.
aliases = ["bot", "help", "greet"]

# How many recent messages are replayed to the model each turn.
history_window = 10

# If set, this password is required to claim an unconfigured device.
# Leave it out and the first person to reach the device becomes its
# administrator - reasonable on a private channel, less so on a phone
# number, where a wrong number would gain the ability to run code.
# admin_password = "change-me"

# --- language ------------------------------------------------------------
#
# Everything the device says for itself - the whole first-boot exchange, the
# connect greeting, and what a bot says before it has been given a
# personality - comes from a locale file. Nothing is hardcoded in English,
# so a device can be built for a language botforge does not ship.
#
# Either the name of a bundled locale in botforge/locales/, or the path to a
# TOML file of the same shape. Copy botforge/locales/en.toml, translate it,
# and point at it:
#
#   language = "/etc/botforge/lv.toml"
#
# A locale must define every message; a missing one is reported when the
# device starts rather than part-way through a conversation.
language = "en"

# Individual lines can still be overridden without a whole locale file.
# These win over whatever the locale says. Placeholders in braces are filled
# in - see botforge/locales/en.toml for which ones each message may use.
#
# [botforge.messages]
# ask_provider = "Which provider should I use? ({providers})"

# Likewise for the prompt a bot uses before it has a personality. To change
# a running bot an administrator uses set_instructions instead.
#
# unconfigured_prompt = """
# You are a bot that has not been given a character yet.
# """

# --- transports ----------------------------------------------------------
#
# Whichever channels zoozl should listen on. See the zoozl documentation.

# [websocket]
# port = 8000

# [slack]
# signing_secret = "..."
# workspace_token = "..."
