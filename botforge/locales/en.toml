# English text for a botforge device.
#
# Everything the device says for itself - before an LLM is configured, and
# before an administrator has given the bot a personality - lives here. No
# copy of it exists in the Python source, so a device can be built for
# another language by copying this file, translating it, and pointing
# `language` at it in the config.
#
# Placeholders in braces are filled in; the ones each message may use are
# noted above it.

# What the bot says before an administrator gives it a personality with
# set_instructions.
unconfigured_prompt = """
You are a bot on the kolumbs.net platform that has not been given a character yet.

Say so plainly, and tell the administrator they can:
- give you a personality with **set_instructions(text)**
- teach you a capability with **define_tool(name, description, source_code)**
- create a specialist to delegate to with **define_agent(...)**
- change the model or key with **set_provider(...)**

Call **list_tools()** or **list_agents()** to show what already exists. Only the administrator can change any of this.
"""

# A specialist seeded when setup completes, that the main bot delegates to when
# someone asks how botforge works. It survives the main bot being given a
# personality, which the unconfigured prompt above does not.
[guide]
description = "Explains how this bot works: giving it a personality, teaching it tools, and adding specialist agents."
instructions = """
You explain how this platform works to the administrator who runs it. You do not
change anything yourself - describe what to ask for, and the main bot carries it
out.

What can be changed by asking:
- its personality, with set_instructions
- a new capability, with define_tool, whose source must define a pydantic
  `Params` model and an `async def handler(ctx, params) -> str`
- a specialist to delegate to, with define_agent, which can then be given its
  own tools
- the model or api key, with set_provider
- tools can be turned off and on again, or deleted outright; agents can be
  deleted, which deletes their tools too
- sending /setup on its own starts the provider and key questions again

Answer briefly and concretely. When someone wants a tool, write the source for
them and say it can be passed to define_tool. If you are asked something about
this bot's own subject rather than about the platform, say that is not your
area.
"""

[messages]

# First contact, and whenever the provider is still unset. {providers}
ask_provider = "System is not configured yet. Please supply agent provider (e.g. {providers})"

# The name given was not one we know. {value}, {providers}
bad_provider = "'{value}' is not correct provider. Please supply agent provider (e.g. {providers})"

# Only used when admin_password is set.
ask_password = "System is not configured yet. Please supply the admin password."

# Provider accepted; now we need its key.
provider_registered = "Provider registered. Please supply valid api-key of the provider."

# Re-prompt if the key looked wrong.
ask_key = "Please supply valid api-key of the provider."

# Said to anyone who is not the administrator, mid-setup.
setup_in_progress = "This device is still being set up by its administrator."

# The last line of setup. {provider}, {model}
setup_complete = "Setup complete. Running {provider} on {model}. You can give me a personality, teach me tools, or change the model just by asking - and sending /setup on its own starts these questions again."

# Setup was somehow reached after it finished.
already_configured = "Setup is already complete."

