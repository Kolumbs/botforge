[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botforge"
version = "0.1.0"
description = "A chatbot platform where bot personality and tools are entirely database content, authored by chatting"
authors = [{name = "Juris Kaminskis", email = "juris.kaminskis@gmail.com"}]
requires-python = ">=3.10"

# Exact pins: botforge is an appliance, not a library, so an install today and
# an install next month should be the same software. litellm and openai are
# transitive but pinned too - a skew between them and the agent SDK is what
# broke the LiteLLM adapter before, so their versions are part of what is being
# guaranteed here.
dependencies = [
    "membank==0.5.6",
    "zoozl==0.2.9",
    "openai-agents[litellm]==0.21.0",
    "litellm==1.83.0",
    "openai==3.1.0",
    "pydantic==2.13.4",
]

[tool.setuptools.package-data]
botforge = ["locales/*.toml"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
