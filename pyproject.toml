[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botforge"
version = "0.1.0"
description = "A chatbot platform where bot personality and tools are entirely database content, authored by chatting"
authors = [{name = "Juris Kaminskis", email = "juris.kaminskis@gmail.com"}]
requires-python = ">=3.10"

dependencies = [
    "membank>=0.5.6",
    "zoozl>=0.2.9",
    "openai-agents>=0.6,<0.7",
    "pydantic>=2.0",
]

[tool.setuptools.package-data]
botforge = ["locales/*.toml"]

[project.optional-dependencies]
litellm = ["openai-agents[litellm]"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
